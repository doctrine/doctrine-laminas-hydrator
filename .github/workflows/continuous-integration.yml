name: "Continuous Integration"

on:
  pull_request:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/continuous-integration.yml"
      - "composer.*"
      - "src/**"
      - "phpunit.xml.dist"
      - "tests/**"
  push:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/continuous-integration.yml"
      - "composer.*"
      - "src/**"
      - "phpunit.xml.dist"
      - "tests/**"

jobs:
  phpunit:
    name: "PHPUnit"
    uses: "doctrine/.github/.github/workflows/continuous-integration.yml@15.1.0"
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      composer-options: "--prefer-dist --with laminas/laminas-hydrator:^5.0.0"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
