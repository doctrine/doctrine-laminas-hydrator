name: "Static Analysis with PHPStan"

on:
  pull_request:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/phpstan.yml"
      - "composer.*"
      - "src/**"
      - "phpstan*"
      - "tests/**"
  push:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/phpstan.yml"
      - "composer.*"
      - "src/**"
      - "phpstan*"
      - "tests/**"

jobs:
  phpstan:
    name: "Static Analysis"
    uses: "doctrine/.github/.github/workflows/phpstan.yml@13.1.0"
    with:
      php-version: "8.4"
